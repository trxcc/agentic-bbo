name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
      - run: uv python install 3.11
      - run: uv sync --python 3.11 --extra dev --locked
      - run: uv run pytest
      - run: uv run python -m bbo.experiments.verify_assets
      - run: uv run python -m compileall -q bbo tests
      - run: uv build
