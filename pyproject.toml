[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bbo-benchmark"
version = "0.1.0"
description = "Workspace-based black-box optimization across five benchmark domains."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "scipy==1.17.1", "cma==4.4.4", "coco-experiment==2.8.2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "build>=1.2"]
hpo = ["scikit-learn==1.8.0", "joblib==1.5.3"]
molecular = ["rdkit==2026.3.1"]
bo = ["botorch==0.18.1", "gpytorch==1.15.2", "torch==2.11.0", "scikit-learn==1.8.0", "optuna==4.8.0"]
git-bo = ["tabpfn @ git+https://github.com/PriorLabs/TabPFN.git@f87b137bc7c4fe021dda76e62720098541575d37"]
all = ["agentic-bbo-benchmark[hpo,molecular,bo]"]

[project.scripts]
bbo = "bbo.run:main"
bbo-frontier = "bbo.experiments.run:main"
bbo-score = "bbo.experiments.report:main"
bbo-placement-service = "bbo.tasks.bboplace.local_service:main"

[tool.setuptools.packages.find]
include = ["bbo*"]

[tool.setuptools.data-files]
"share/agentic-bbo-benchmark" = ["THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
bbo = [
  "task_descriptions/**/*.md", "task_descriptions/**/*.json",
  "task_context_profiles/**/*.md", "task_context_profiles/**/*.json",
  "tasks/hpo/assets/*.npz", "tasks/hpo/assets/*.json",
  "tasks/dbtune/assets/*.json", "tasks/bboplace/assets/repair_bundles/*.json",
  "tasks/dbtune/docker_surrogate/*", "tasks/dbtune/assets/README.md", "tasks/*/README.md",
  "algorithms/model_based/_vendor/*.txt",
  "algorithms/molecular/*.txt",
  "experiments/assets/**/*.json", "experiments/assets/**/*.md", "experiments/assets/*.json", "experiments/assets/*.md",
  "experiments/assets/**/*.py", "experiments/assets/**/*.csv", "experiments/assets/*.csv",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires Docker or external evaluator assets"]
